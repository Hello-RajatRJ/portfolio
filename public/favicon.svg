<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Deep Pure Pitch Black -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#0a0202" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Theme Text Gradient (Bright Crimson Red -> Deep Red) -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b3b" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Accent Border Gradient (Pure Red & Black) -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7f1d1d" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.9" />
    </linearGradient>

    <!-- Red Neon Glow Filter -->
    <filter id="neonRedGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Black Cyber Rounded Container -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="12" />

  <!-- Ambient Red Core Glow -->
  <circle cx="256" cy="256" r="170" fill="#dc2626" opacity="0.22" filter="blur(45px)" />

  <!-- Corner Cyber Tech Accents -->
  <rect x="42" y="42" width="28" height="6" fill="#ef4444" opacity="0.8" rx="3" />
  <rect x="42" y="42" width="6" height="28" fill="#ef4444" opacity="0.8" rx="3" />
  <rect x="442" y="464" width="28" height="6" fill="#ef4444" opacity="0.8" rx="3" />
  <rect x="464" y="442" width="6" height="28" fill="#ef4444" opacity="0.8" rx="3" />

  <!-- RJ Monogram in Red & Black -->
  <text
    x="256"
    y="322"
    font-family="'Orbitron', 'Inter', 'Segoe UI', 'Roboto', sans-serif"
    font-size="220"
    font-weight="900"
    fill="url(#redGradient)"
    text-anchor="middle"
    filter="url(#neonRedGlow)"
    letter-spacing="-8"
  >
    RJ
  </text>

  <!-- Accent Status Dot -->
  <circle cx="410" cy="115" r="14" fill="#ef4444" filter="url(#neonRedGlow)" />
</svg>