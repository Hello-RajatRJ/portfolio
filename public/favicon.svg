<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Theme Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Theme Text Gradient (Indigo -> Purple -> Neon Pink) -->
    <linearGradient id="themeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="8" />

  <!-- Ambient Inner Theme Glow -->
  <circle cx="256" cy="256" r="180" fill="#6366f1" opacity="0.15" filter="blur(35px)" />

  <!-- RJ Monogram Text in Theme Color Gradient -->
  <text
    x="256"
    y="320"
    font-family="'Orbitron', 'Inter', 'Segoe UI', 'Roboto', sans-serif"
    font-size="225"
    font-weight="900"
    fill="url(#themeGradient)"
    text-anchor="middle"
    filter="url(#neonGlow)"
    letter-spacing="-8"
  >
    RJ
  </text>
</svg>